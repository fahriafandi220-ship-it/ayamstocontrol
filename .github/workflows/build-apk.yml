name: Build Ayam Stop Control APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -o AyamStopControl-CLOUD-BUILD.zip -d extracted
         
      - name: Build APK
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew tidak ditemukan di dalam ZIP"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
 
      

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyamStopControl-APK
          path: app/build/outputs/apk/debug/*.apk
          
